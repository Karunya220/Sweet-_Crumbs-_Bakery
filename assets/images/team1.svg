<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="#FF9A8B" />
  
  <!-- Person silhouette -->
  <circle cx="150" cy="100" r="60" fill="#8C52FF" />
  <path d="M90,220 C90,160 210,160 210,220 L210,300 L90,300 Z" fill="#8C52FF" />
  
  <!-- Face details -->
  <circle cx="130" cy="90" r="8" fill="#FFFFFF" />
  <circle cx="130" cy="90" r="4" fill="#333333" />
  <circle cx="170" cy="90" r="8" fill="#FFFFFF" />
  <circle cx="170" cy="90" r="4" fill="#333333" />
  
  <!-- Smile -->
  <path d="M130,120 C140,130 160,130 170,120" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" />
  
  <!-- Chef hat -->
  <path d="M90,60 C90,40 110,30 150,30 C190,30 210,40 210,60 L210,70 C210,50 190,40 150,40 C110,40 90,50 90,70 Z" fill="#FFFFFF" />
  <path d="M90,70 L210,70" stroke="#EEEEEE" stroke-width="2" />
  
  <!-- Apron -->
  <path d="M110,150 L190,150 L180,220 L120,220 Z" fill="#FFFFFF" />
  <path d="M140,150 L140,220" stroke="#EEEEEE" stroke-width="2" />
  <path d="M160,150 L160,220" stroke="#EEEEEE" stroke-width="2" />
  <rect x="130" y="170" width="40" height="10" rx="5" fill="#8C52FF" />
</svg>