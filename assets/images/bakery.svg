<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Building structure -->
  <rect x="50" y="100" width="200" height="150" fill="#FF9A8B" />
  
  <!-- Roof -->
  <path d="M40,100 L150,40 L260,100 Z" fill="#8C52FF" />
  
  <!-- Windows -->
  <rect x="80" y="120" width="40" height="40" fill="#82D8EE" />
  <line x1="100" y1="120" x2="100" y2="160" stroke="#FFFFFF" stroke-width="2" />
  <line x1="80" y1="140" x2="120" y2="140" stroke="#FFFFFF" stroke-width="2" />
  
  <rect x="180" y="120" width="40" height="40" fill="#82D8EE" />
  <line x1="200" y1="120" x2="200" y2="160" stroke="#FFFFFF" stroke-width="2" />
  <line x1="180" y1="140" x2="220" y2="140" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Door -->
  <rect x="130" y="170" width="40" height="80" fill="#8C52FF" />
  <circle cx="160" cy="210" r="5" fill="#FFD700" />
  
  <!-- Signboard -->
  <rect x="90" y="70" width="120" height="30" fill="#FFD700" />
  <text x="150" y="90" font-family="Arial" font-size="14" text-anchor="middle" fill="#3E2723">SWEET CRUMBS</text>
  
  <!-- Decorative elements -->
  <rect x="40" y="250" width="220" height="5" fill="#3E2723" />
  
  <!-- Cupcake icon on door -->
  <circle cx="150" cy="190" r="10" fill="#FFD1DC" />
  <path d="M145,190 C145,183 150,183 150,180 C150,183 155,183 155,190 Z" fill="#FFFFFF" />
  <rect x="147" y="190" width="6" height="8" fill="#C8A165" />
  
  <!-- Smoke from chimney -->
  <path d="M210,40 C215,30 220,35 220,30 C220,35 225,30 230,40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
  <path d="M215,30 C220,20 225,25 225,20 C225,25 230,20 235,30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
</svg>