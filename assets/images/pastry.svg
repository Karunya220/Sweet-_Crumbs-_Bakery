  <path d="M90,85 C105,70 120,70 135,85 C150,100 170,100 185,85 C200,70 220,85 205,100 C190,115 190,135 205,150 C220,165 210,185 195,170 C180,155 150,155 135,170 C120,185 100,185 85,170 C70,155 70,135 85,120 C100,105 100,85 90,85 Z" fill="#FFCE54" />
  
