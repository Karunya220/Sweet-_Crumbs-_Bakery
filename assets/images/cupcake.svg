<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="300" fill="#F8F8F8"/>
    
    <!-- Cupcake Base -->
    <path d="M120 180 L130 250 L170 250 L180 180 Z" fill="#C8A165"/>
    <rect x="125" y="240" width="50" height="10" rx="2" fill="#9E7B41"/>
    
    <!-- Frosting -->
    <path d="M110 180 C110 150 150 130 150 130 C150 130 190 150 190 180 Z" fill="#FFD1DC"/>
    
    <!-- Sprinkles -->
    <rect x="130" y="150" width="8" height="3" rx="1.5" fill="#FF5555" transform="rotate(45 130 150)"/>
    <rect x="145" y="140" width="8" height="3" rx="1.5" fill="#55FF55" transform="rotate(-30 145 140)"/>
    <rect x="165" y="155" width="8" height="3" rx="1.5" fill="#5555FF" transform="rotate(60 165 155)"/>
    <rect x="140" y="165" width="8" height="3" rx="1.5" fill="#FFFF55" transform="rotate(-45 140 165)"/>
    <rect x="155" y="150" width="8" height="3" rx="1.5" fill="#FF55FF" transform="rotate(10 155 150)"/>
    
    <!-- Cherry on top -->
    <circle cx="150" cy="130" r="8" fill="#FF2222"/>
    <path d="M150 122 C150 122 155 110 160 105" stroke="#008800" stroke-width="2"/>
    
    <text x="150" y="280" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Cupcake</text>
</svg>