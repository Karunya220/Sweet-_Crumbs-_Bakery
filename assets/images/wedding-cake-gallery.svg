<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#F8F8F8"/>
    
    <!-- Bottom Tier -->
    <rect x="150" y="220" width="300" height="130" rx="10" fill="#FFFFFF"/>
    <rect x="150" y="220" width="300" height="15" rx="5" fill="#F0F0F0"/>
    
    <!-- Middle Tier -->
    <rect x="180" y="140" width="240" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="180" y="140" width="240" height="15" rx="5" fill="#F0F0F0"/>
    
    <!-- Top Tier -->
    <rect x="230" y="80" width="140" height="60" rx="10" fill="#FFFFFF"/>
    <rect x="230" y="80" width="140" height="15" rx="5" fill="#F0F0F0"/>
    
    <!-- Cake Stand -->
    <ellipse cx="300" cy="350" rx="170" ry="15" fill="#E0E0E0"/>
    <rect x="275" y="335" width="50" height="20" fill="#D0D0D0"/>
    
    <!-- Decorative Lines on Bottom Tier -->
    <path d="M160 240 C185 230 215 260 240 240 C265 220 290 260 315 240 C340 220 365 260 390 240 C415 220 440 250 440 240" stroke="#E0E0E0" stroke-width="3" fill="none"/>
    <path d="M160 270 C185 260 215 290 240 270 C265 250 290 290 315 270 C340 250 365 290 390 270 C415 250 440 280 440 270" stroke="#E0E0E0" stroke-width="3" fill="none"/>
    <path d="M160 300 C185 290 215 320 240 300 C265 280 290 320 315 300 C340 280 365 320 390 300 C415 280 440 310 440 300" stroke="#E0E0E0" stroke-width="3" fill="none"/>
    
    <!-- Decorative Lines on Middle Tier -->
    <path d="M190 160 C205 150 225 180 245 160 C265 140 285 180 305 160 C325 140 345 180 365 160 C385 140 405 170 410 160" stroke="#E0E0E0" stroke-width="2" fill="none"/>
    <path d="M190 180 C205 170 225 200 245 180 C265 160 285 200 305 180 C325 160 345 200 365 180 C385 160 405 190 410 180" stroke="#E0E0E0" stroke-width="2" fill="none"/>
    
    <!-- Decorative Lines on Top Tier -->
    <path d="M240 100 C250 90 260 110 270 100 C280 90 290 110 300 100 C310 90 320 110 330 100 C340 90 350 110 360 100" stroke="#E0E0E0" stroke-width="2" fill="none"/>
    <path d="M240 120 C250 110 260 130 270 120 C280 110 290 130 300 120 C310 110 320 130 330 120 C340 110 350 130 360 120" stroke="#E0E0E0" stroke-width="2" fill="none"/>
    
    <!-- Cake Topper -->
    <path d="M290 60 L290 80 L310 80 L310 60" stroke="#C0C0C0" stroke-width="1" fill="none"/>
    <circle cx="297" cy="50" r="8" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="1"/>
    <circle cx="303" cy="50" r="8" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="1"/>
    
    <!-- Flower Decorations -->
    <circle cx="160" cy="220" r="8" fill="#FFECF5"/>
    <circle cx="160" cy="220" r="4" fill="#FFD1DC"/>
    
    <circle cx="440" cy="220" r="8" fill="#FFECF5"/>
    <circle cx="440" cy="220" r="4" fill="#FFD1DC"/>
    
    <circle cx="180" cy="140" r="8" fill="#FFECF5"/>
    <circle cx="180" cy="140" r="4" fill="#FFD1DC"/>
    
    <circle cx="420" cy="140" r="8" fill="#FFECF5"/>
    <circle cx="420" cy="140" r="4" fill="#FFD1DC"/>
    
    <circle cx="230" cy="80" r="8" fill="#FFECF5"/>
    <circle cx="230" cy="80" r="4" fill="#FFD1DC"/>
    
    <circle cx="370" cy="80" r="8" fill="#FFECF5"/>
    <circle cx="370" cy="80" r="4" fill="#FFD1DC"/>
    
    <!-- Other Small Floral Decorations -->
    <circle cx="200" cy="250" r="5" fill="#FFECF5"/>
    <circle cx="200" cy="250" r="2" fill="#FFD1DC"/>
    
    <circle cx="250" cy="260" r="5" fill="#FFECF5"/>
    <circle cx="250" cy="260" r="2" fill="#FFD1DC"/>
    
    <circle cx="300" cy="240" r="5" fill="#FFECF5"/>
    <circle cx="300" cy="240" r="2" fill="#FFD1DC"/>
    
    <circle cx="350" cy="260" r="5" fill="#FFECF5"/>
    <circle cx="350" cy="260" r="2" fill="#FFD1DC"/>
    
    <circle cx="400" cy="250" r="5" fill="#FFECF5"/>
    <circle cx="400" cy="250" r="2" fill="#FFD1DC"/>
    
    <!-- Middle Tier Decorations -->
    <circle cx="220" cy="170" r="4" fill="#FFECF5"/>
    <circle cx="220" cy="170" r="1.5" fill="#FFD1DC"/>
    
    <circle cx="260" cy="160" r="4" fill="#FFECF5"/>
    <circle cx="260" cy="160" r="1.5" fill="#FFD1DC"/>
    
    <circle cx="300" cy="170" r="4" fill="#FFECF5"/>
    <circle cx="300" cy="170" r="1.5" fill="#FFD1DC"/>
    
    <circle cx="340" cy="160" r="4" fill="#FFECF5"/>
    <circle cx="340" cy="160" r="1.5" fill="#FFD1DC"/>
    
    <circle cx="380" cy="170" r="4" fill="#FFECF5"/>
    <circle cx="380" cy="170" r="1.5" fill="#FFD1DC"/>
    
    <text x="300" y="380" font-family="Arial" font-size="18" fill="#333333" text-anchor="middle">Wedding Cake</text>
